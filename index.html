<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="theme-toggle">
      <button type="button" id="theme-toggle-btn" class="theme-btn" title="Alternar modo claro/oscuro">
        <span class="theme-icon" aria-hidden="true"></span>
        <span class="theme-label"></span>
      </button>
    </div>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-overlay" class="pause-overlay pause-hidden">
      <div class="pause-menu" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <p id="pause-title" class="pause-title">PAUSA</p>

        <button type="button" id="pause-resume-btn" class="pause-btn pause-btn-primary">Reanudar</button>
        <button type="button" id="pause-restart-btn" class="pause-btn">Reiniciar</button>
        <button type="button" id="pause-controls-btn" class="pause-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>

        <div id="pause-controls" class="pause-controls pause-hidden"></div>

        <div class="pause-field">
          <label class="pause-field-label" for="pause-level-select">NIVEL INICIAL</label>
          <select id="pause-level-select" class="pause-select"></select>
        </div>
        <p class="pause-note">Se aplica a la próxima partida</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
