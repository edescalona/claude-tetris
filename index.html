<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="theme-toggle">
      <button type="button" id="theme-toggle-btn" class="theme-btn" title="Alternar modo claro/oscuro">
        <span class="theme-icon" aria-hidden="true"></span>
        <span class="theme-label"></span>
      </button>
    </div>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="hs-gameover-panel" class="hs-panel hs-hidden">
          <p id="hs-run-summary" class="hs-run-summary"></p>
          <div id="hs-name-form" class="hs-name-form hs-hidden">
            <span class="hs-form-label">¡Nuevo record! Escribe tu nombre</span>
            <div class="hs-form-row">
              <input id="hs-name-input" class="hs-input" type="text" maxlength="12" autocomplete="off" spellcheck="false" aria-label="Nombre del jugador" />
              <button type="button" id="hs-save-btn" class="hs-btn">Guardar</button>
            </div>
          </div>
          <div id="hs-gameover-scores" class="hs-scores"></div>
        </div>
        <button id="restart-btn">Reiniciar</button>
        <button type="button" id="start-menu-btn" class="hs-btn hs-btn-ghost hs-hidden">Menú</button>
      </div>
    </div>

    <div id="start-screen" class="start-screen">
      <div class="start-box">
        <p class="start-title">TETRIS</p>
        <div id="start-scores" class="hs-scores"></div>
        <div class="start-row">
          <label class="start-label" for="start-level-select">NIVEL INICIAL</label>
          <select id="start-level-select" class="start-select"></select>
        </div>
        <button type="button" id="start-play-btn" class="start-play">JUGAR</button>
        <button type="button" id="start-reset-btn" class="hs-btn hs-btn-ghost">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
